<style>:root{

body.night .btn.primary{color:#fff} body.night .chip.on{color:#fff} body.night .btn.danger{border-color:#6B3A3A}

.card.link{display:block;width:100%;text-align:left;cursor:pointer;border-left:5px solid var(--green)} .card.link:active{background:var(--green-l)}

.lock{font-size:1.2rem}

.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:700;background:var(--green-l);color:var(--green-d);border:2px solid transparent}
.pill.LT{background:#E3ECF5;color:var(--blue)} body.night .pill.LT{background:#1F2C3A;color:#9CC3E8}
.pill.open{border-color:var(--amber)}
.tag.big.LT{background:#E3ECF5;color:var(--blue)} body.night .tag.big.LT{background:#1F2C3A;color:#9CC3E8}
.card.sess{border-left-color:var(--green)} .card.sess.open{border-left-color:var(--amber)}
.sess-row{display:flex;align-items:baseline;gap:10px} .sess-no{font-size:1.25rem;font-weight:700;flex:1;letter-spacing:.02em} .sess-date{color:var(--muted);font-size:.95rem}

.datehd{font-weight:700;color:var(--muted);font-size:.9rem;margin:10px 0 6px;padding-left:2px}

.btn.lt{background:var(--blue)} body.night .btn.lt{background:#3F76AD}
.addrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 10px}

.cov td.m{color:#7A5106}.cov td.d{color:var(--green-d)}.cov td.e{color:#24486E}body.night .cov td.m{color:#E9C46A}body.night .cov td.e{color:#9CC3E8}

.cbtn{min-width:44px;padding:6px 8px;font-size:1.2rem;flex:0 0 auto}

/* ---------- storage (IndexedDB key-value, localStorage fallback) ---------- */
const DB = (() => {
  let dbp = null, mem = {};
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    if (!window.indexedDB) return res(null);
    const rq = indexedDB.open("brcc-mongolia", 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore("kv");
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => res(null);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    if (!db) return fn(null);
    return new Promise((res, rej) => {
      const st = db.transaction("kv", mode).objectStore("kv");
      const r = fn(st);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  };
  return {
    async get(k) { try { const v = await tx("readonly", st => st ? st.get(k) : null); if (v !== undefined && v !== null) return v; } catch (e) { }
      try { const s = localStorage.getItem("brcc:" + k); return s ? JSON.parse(s) : undefined; } catch (e) { return mem[k]; } },
    async set(k, v) { try { await tx("readwrite", st => st.put(v, k)); return; } catch (e) { }
      try { localStorage.setItem("brcc:" + k, JSON.stringify(v)); } catch (e) { mem[k] = v; } },
    async del(k) { try { await tx("readwrite", st => st.delete(k)); } catch (e) { } try { localStorage.removeItem("brcc:" + k); } catch (e) { } delete mem[k]; },
    async keys() { try { const ks = await tx("readonly", st => st.getAllKeys()); if (ks) return ks; } catch (e) { }
      const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("brcc:")) out.push(k.slice(5)); } } catch (e) { } return out.concat(Object.keys(mem)); },
  };
})();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });

/* ---------- species ---------- */
const norm = s => (s || "").toLowerCase().replace(/ё/g, "е").replace(/[’'`]/g, "").trim();
const speciesName = (sp, lang) => lang === "la" ? sp.L : lang === "en" ? (sp.E || sp.L) : (sp.M || sp.E || sp.L);
function searchSpecies(list, q, limit = 40) {
  q = norm(q); if (!q) return [];
  const starts = [], inside = [];
  for (const sp of list) {
    const fields = [sp.M, sp.E, sp.L].map(norm);
    if (fields.some(f => f.startsWith(q) || f.split(/[\s-]+/).some(w => w.startsWith(q)))) starts.push(sp);
    else if (fields.some(f => f.includes(q))) inside.push(sp);
    if (starts.length >= limit) break;
  }
  return starts.concat(inside).slice(0, limit);
}

/* ---------- geo ---------- */
const R_EARTH = 6371000;
function haversine(a, b) {
  const toR = x => x * Math.PI / 180, dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.sqrt(h));
}
function destPoint(lat, lng, bearingDeg, distM) {
  const toR = x => x * Math.PI / 180, toD = x => x * 180 / Math.PI;
  const φ1 = toR(lat), λ1 = toR(lng), θ = toR(bearingDeg), δ = distM / R_EARTH;
  const φ2 = Math.asin(Math.sin(φ1) * Math.cos(δ) + Math.cos(φ1) * Math.sin(δ) * Math.cos(θ));
  const λ2 = λ1 + Math.atan2(Math.sin(θ) * Math.sin(δ) * Math.cos(φ1), Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2));
  return { lat: +toD(φ2).toFixed(5), lng: +toD(λ2).toFixed(5) };
}
const trackLength = pts => { let d = 0; for (let i = 1; i < pts.length; i++) d += haversine(pts[i - 1], pts[i]); return Math.round(d); };
function getPosition(opts = {}) {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("no geolocation"));
    navigator.geolocation.getCurrentPosition(p => res({ lat: +p.coords.latitude.toFixed(5), lng: +p.coords.longitude.toFixed(5), acc: Math.round(p.coords.accuracy) }),
      rej, { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000, ...opts });
  });

  saveMeta();
  for (const s of d.sessions || []) { const cur = Store.s.sessions[s.id]; if (!cur || (s.updatedAt || 0) > (cur.updatedAt || 0)) saveSession(s); }
  for (const n of d.notes || []) { const cur = Store.s.notes[n.id]; if (!cur || (n.updatedAt || 0) > (cur.updatedAt || 0)) saveNote(n); }
  for (const [pid, p] of Object.entries(d.photos || {})) await DB.set("photo:" + pid, p);
  await Store.flush();
}

/* ----- global VP alarm watcher (works on any screen while the app is open) ----- */
setInterval(() => {
  if (!Store.s) return;
  for (const sess of Object.values(Store.s.sessions)) {
    if (sess.type !== "VP" || sess.status !== "open" || !sess.startedAt || sess.alarmed) continue;
    const planned = (+sess.plannedH || 0) * 3600000; if (!planned) continue;
    if (Date.now() - sess.startedAt >= planned) { beep(4); updSession(sess.id, n => { n.alarmed = true; n.end = n.end || nowHM(); }); showToast(t("timeUp") + " — " + sess.type + " " + (sess.number || "")); }
  }
}, 5000);
</script>
<script>/* ===== BRCC Mongolia — shared UI widgets ===== */
const nav = h => { location.hash = h; };
const goBack = () => { if (history.length > 1) history.back(); else nav("#/"); };

let toastTimer = null;
function showToast(msg, action) { Store.toast = { msg, action, id: uid() }; Store.emit(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { Store.toast = null; Store.emit(); }, action ? 7000 : 2500); }

function TopBar({ title, sub, back = true, right }) {
  return html`<header class="topbar">
    ${back ? html`<button class="iconbtn" onClick=${goBack} aria-label=${t("back")}>‹</button>` : html`<img src="logo-small.png" alt="BRCC" class="logo-sm"/>`}
    <div class="topbar-title"><div class="tt">${title}</div>${sub ? html`<div class="ts">${sub}</div>` : null}</div>
    <div class="topbar-right">${right}</div>
  </header>`;
}
const Btn = ({ children, onClick, kind = "primary", small, disabled, cls = "", type = "button" }) => html`<button type=${type} class=${`btn ${kind} ${small ? "small" : ""} ${cls}`} onClick=${onClick} disabled=${disabled}>${children}</button>`;
const Field = ({ label, children, span, hint }) => html`<div class=${`field ${span ? "span" : ""}`}><label class="lbl">${label}</label>${children}${hint ? html`<div class="hint">${hint}</div>` : null}</div>`;
const Input = ({ onChange, value, class: cls, ...p }) => html`<input ...${p} class=${`inp ${cls || ""}`} value=${value ?? ""} onInput=${e => onChange(e.target.value)} />`;
const outOfRange = (v, min, max) => v !== "" && v !== null && v !== undefined && !isNaN(+v) && ((min !== undefined && +v < +min) || (max !== undefined && +v > +max));
const NumInput = p => html`<input type="number" inputmode=${p.decimal ? "decimal" : "numeric"} step=${p.decimal ? "0.1" : "1"} min=${p.min} max=${p.max} placeholder=${p.placeholder || ""} class=${`inp ${p.class || ""} ${p.range && outOfRange(p.value, p.min, p.max) ? "bad" : ""}`} value=${p.value ?? ""} onInput=${e => p.onChange(e.target.value)} disabled=${p.disabled} />`;
const TextArea = p => html`<textarea class="inp ta" rows=${p.rows || 2} placeholder=${p.placeholder || ""} value=${p.value ?? ""} onInput=${e => p.onChange(e.target.value)} disabled=${p.disabled}></textarea>`;
function TimeInput({ value, onChange, disabled }) {
  return html`<div class="row"><input type="time" class="inp" value=${value || ""} onInput=${e => onChange(e.target.value)} disabled=${disabled}/><${Btn} kind="ghost" small onClick=${() => onChange(nowHM())} disabled=${disabled}>${t("now")}<//></div>`;
}
function Chips({ options, value, onChange, multi, disabled }) {
  const sel = multi ? (value || []) : value;
  const isOn = o => multi ? sel.includes(o) : sel === o;
  const toggle = o => { if (disabled) return; if (multi) onChange(isOn(o) ? sel.filter(x => x !== o) : [...sel, o]); else onChange(isOn(o) ? "" : o); };
  return html`<div class="chips">${options.map(o => html`<button type="button" key=${o} class=${`chip ${isOn(o) ? "on" : ""}`} onClick=${() => toggle(o)}>${o}</button>`)}</div>`;
}
function Modal({ title, children, onClose }) {
  useEffect(() => { const k = e => { if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);
  return html`<div class="modal-bg" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}><div class="modal" role="dialog"><div class="modal-h"><div class="tt">${title}</div><button class="iconbtn" onClick=${onClose}>×</button></div><div class="modal-b">${children}</div></div></div>`;
}
const Empty = ({ children }) => html`<div class="empty">${children}</div>`;
const confirmDlg = msg => window.confirm(msg);

/* ---------- Count picker ---------- */
function CountPicker({ value, onChange, disabled }) {
  const [manual, setManual] = useState(value !== "" && (+value > 9 || isNaN(+value)));
  return html`<div>
    <div class="countgrid">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => html`<button type="button" key=${n} class=${`chip big ${String(value) === String(n) && !manual ? "on" : ""}`} disabled=${disabled} onClick=${() => { setManual(false); onChange(String(value) === String(n) ? "" : String(n)); }}>${n}</button>`)}
      <button type="button" class=${`chip big ${manual ? "on" : ""}`} disabled=${disabled} onClick=${() => { setManual(true); if (+value <= 9) onChange(""); }}>${t("more")}</button>
    </div>
    ${manual ? html`<${NumInput} value=${value} onChange=${onChange} min="1" placeholder="10, 25, 120…" disabled=${disabled} class="mt"/>` : null}
  </div>`;
}

/* ---------- Species picker ---------- */
function SpeciesPicker({ value, onChange, lang, disabled, autoFocus }) {
  const [q, setQ] = useState(""); const [open, setOpen] = useState(false); const [adding, setAdding] = useState(false);
  const list = allSpecies();
  const results = useMemo(() => searchSpecies(list, q), [q, list.length]);
  const pick = sp => { onChange(sp); setQ(""); setOpen(false); };
  if (value) {
    const other = ["mn", "en", "la"].filter(l => l !== lang).map(l => speciesName(value, l)).filter(Boolean);
    return html`<div class="sp-sel">
      <div><div class="sp-main">${speciesName(value, lang)}</div><div class="sp-sub">${gLabel(value.g)} · ${other.join(" · ")}</div></div>
      ${!disabled ? html`<button type="button" class="iconbtn" onClick=${() => onChange(null)} aria-label="clear">×</button>` : null}
    </div>`;
  }
  return html`<div class="sp-wrap">
    <input class="inp" placeholder=${t("speciesSearch")} value=${q} autofocus=${autoFocus} disabled=${disabled} onInput=${e => { setQ(e.target.value); setOpen(true); }} onFocus=${() => setOpen(true)} autocomplete="off"/>
    ${open && q ? html`<div class="sp-list">
      ${results.map(sp => html`<button type="button" key=${sp.L} class="sp-item" onClick=${() => pick(sp)}>
        <span class="sp-main">${speciesName(sp, lang)}</span><span class="sp-sub">${gLabel(sp.g)} · ${["mn", "en", "la"].filter(l => l !== lang).map(l => speciesName(sp, l)).join(" · ")}</span>
      </button>`)}
      <button type="button" class="sp-item add" onClick=${() => setAdding(true)}>+ ${t("addSpecies")}${q ? ` — “${q}”` : ""}</button>
    </div>` : null}
    ${adding ? html`<${AddSpeciesModal} initial=${q} onClose=${() => setAdding(false)} onAdd=${sp => { setAdding(false); pick(sp); }}/>` : null}
  </div>`;
}
function AddSpeciesModal({ initial, onClose, onAdd }) {
  const isCyr = /[\u0400-\u04FF]/.test(initial);
  const [f, setF] = useState({ g: "B", L: !isCyr && /^[A-Z][a-z]+ [a-z]/.test(initial) ? initial : "", M: isCyr ? initial : "", E: !isCyr && !/^[A-Z][a-z]+ [a-z]/.test(initial) ? initial : "" });
  const set = k => v => setF({ ...f, [k]: v });
  const ok = () => {
    const sp = { g: f.g, L: f.L.trim(), M: f.M.trim(), E: f.E.trim(), custom: true };
    if (!(sp.L || sp.M || sp.E)) return;
    sp.L = sp.L || sp.E || sp.M; Store.s.meta.customSpecies.push(sp); saveMeta(); showToast(t("customSpeciesSaved")); onAdd(sp);
  };
  return html`<${Modal} title=${t("addSpecies")} onClose=${onClose}>
    <${Field} label=${t("chooseGroup")}><${Chips} options=${["B", "M", "R", "A"].map(gLabel)} value=${gLabel(f.g)} onChange=${v => set("g")(["B", "M", "R", "A"].find(g => gLabel(g) === v) || f.g)}/><//>
    <${Field} label=${t("mnName")}><${Input} value=${f.M} onChange=${set("M")}/><//>
    <${Field} label=${t("enName")}><${Input} value=${f.E} onChange=${set("E")}/><//>
    <${Field} label=${t("latin")}><${Input} value=${f.L} onChange=${set("L")} placeholder="Genus species"/><//>
    <div class="row end"><${Btn} kind="ghost" onClick=${onClose}>${t("cancel")}<//><${Btn} onClick=${ok}>${t("save")}<//></div>
  <//>`;
}

/* ---------- Activity picker (multi, searchable, custom) ---------- */
function ActivityPicker({ group, value, onChange, disabled }) {
  const [q, setQ] = useState(""); const [expanded, setExpanded] = useState(false);
  const base = ACT[group] || []; const custom = (Store.s.meta.customActivities[group] || []).map(x => ["", x]);
  const all = base.concat(custom);
  const sel = value || [];
  const nq = norm(q);
  const shown = nq ? all.filter(([c, n]) => norm(c).startsWith(nq) || norm(n).includes(nq)) : all;
  const toggle = n => { if (disabled) return; onChange(sel.includes(n) ? sel.filter(x => x !== n) : [...sel, n]); };
  const addCustom = () => { const v = q.trim(); if (!v) return; if (!all.find(([, n]) => n === v)) { Store.s.meta.customActivities[group] = [...(Store.s.meta.customActivities[group] || []), v]; saveMeta(); } toggle(v); setQ(""); };
  return html`<div>
    ${sel.length ? html`<div class="chips mb">${sel.map(n => html`<button type="button" key=${n} class="chip on" disabled=${disabled} onClick=${() => toggle(n)}>${n} ×</button>`)}</div>` : null}
    ${!disabled ? html`<input class="inp" placeholder=${t("activitySearch")} value=${q} onInput=${e => setQ(e.target.value)} onKeyDown=${e => { if (e.key === "Enter") { e.preventDefault(); if (shown.length === 1) { toggle(shown[0][1]); setQ(""); } else addCustom(); } }}/>` : null}
    ${!disabled && (nq || expanded) ? html`<div class="chips mt">
      ${shown.filter(([, n]) => !sel.includes(n)).map(([c, n]) => html`<button type="button" key=${n} class="chip" onClick=${() => { toggle(n); setQ(""); }}>${c ? html`<b>${c}</b> ` : null}${n}</button>`)}
      ${nq && !all.find(([, n]) => norm(n) === nq) ? html`<button type="button" class="chip add" onClick=${addCustom}>${t("add")} “${q}”</button>` : null}
    </div>` : null}
    ${!disabled && !nq ? html`<button type="button" class="linkbtn" onClick=${() => setExpanded(!expanded)}>${expanded ? "▴ " + t("hideList") : "▾ " + t("showList")}</button>` : null}
  </div>`;
}

/* ---------- Weather ---------- */
function WeatherFields({ value, onChange, disabled }) {
  const w = value || {}; const set = k => v => onChange({ ...w, [k]: v });
  return html`<div class="weather">
    <${Field} label=${t("cloud")}><${Chips} options=${CLOUD} value=${w.cloud} onChange=${set("cloud")} disabled=${disabled}/><//>
    <${Field} label=${t("precip")}><${Chips} options=${PRECIP} value=${w.precip} onChange=${set("precip")} disabled=${disabled}/><//>
    <div class="grid2">
      <${Field} label=${t("wind")}><${NumInput} decimal value=${w.wind} onChange=${set("wind")} min="0" disabled=${disabled}/><//>
      <${Field} label=${t("weatherNote")}><${Input} value=${w.note} onChange=${set("note")} disabled=${disabled}/><//>
    </div>
  </div>`;
}

/* ---------- Count strip (1–9, 9+) ---------- */
function CountStrip({ value, onChange, disabled }) {
  const [manual, setManual] = useState(value !== "" && (+value > 9 || isNaN(+value)));
  return html`<div class="strip">
    ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => html`<button type="button" key=${n} class=${`chip sm ${String(value) === String(n) && !manual ? "on" : ""}`} disabled=${disabled} onClick=${() => { setManual(false); onChange(String(value) === String(n) ? "" : String(n)); }}>${n}</button>`)}
    <button type="button" class=${`chip sm ${manual ? "on" : ""}`} disabled=${disabled} onClick=${() => { setManual(true); if (+value <= 9) onChange(""); }}>9+</button>
    ${manual ? html`<input type="number" inputmode="numeric" min="1" class="inp sm" value=${value} onInput=${e => onChange(e.target.value)} disabled=${disabled}/>` : null}
  </div>`;
}
/* ---------- Category + count picker (age, sex) ---------- */
function CountedChips({ options, value, onChange, disabled }) {
  const v = value || {}; const [openKey, setOpenKey] = useState(null);
  const tap = k => { if (disabled) return; if (!(k in v)) { onChange({ ...v, [k]: "" }); setOpenKey(k); } else setOpenKey(openKey === k ? null : k); };
  const setCount = (k, n) => { onChange({ ...v, [k]: n }); if (n !== "" && +n <= 9) setOpenKey(null); };
  const remove = k => { const n = { ...v }; delete n[k]; onChange(n); setOpenKey(null); };
  const open = openKey && openKey in v ? openKey : null;
  return html`<div>
    <div class="chips">${options.map(([k, l]) => html`<button type="button" key=${k} class=${`chip ${k in v ? "on" : ""} ${open === k ? "editing" : ""}`} disabled=${disabled} onClick=${() => tap(k)}>${l}${k in v && v[k] !== "" ? html`<span class="cbadge">${v[k]}</span>` : null}</button>`)}</div>
    ${open ? html`<div class="strip mt">
      ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => html`<button type="button" key=${n} class=${`chip sm ${String(v[open]) === String(n) ? "on" : ""}`} onClick=${() => setCount(open, String(v[open]) === String(n) ? "" : String(n))}>${n}</button>`)}
      <input type="number" inputmode="numeric" min="1" placeholder="9+" class="inp sm" value=${+v[open] > 9 ? v[open] : ""} onInput=${e => setCount(open, e.target.value)}/>
      <button type="button" class="chip sm del" onClick=${() => remove(open)}>×</button>
    </div>` : null}
  </div>`;
}
function AgePicker({ group, value, other, onChange, onOther, disabled }) {
  const opts = AGE[group];
  const [custom, setCustom] = useState(!!other);
  if (!opts) return html`<${Input} value=${other} onChange=${onOther} placeholder=${t("freeText")} disabled=${disabled}/>`;
  return html`<div>
    <${CountedChips} options=${opts} value=${value} onChange=${onChange} disabled=${disabled}/>
    ${!disabled ? html`<button type="button" class=${`chip mt ${(custom || other) ? "on" : ""}`} onClick=${() => { if (custom || other) { setCustom(false); onOther(""); } else setCustom(true); }}>${t("add")}</button>` : null}
    ${(custom || other) ? html`<${Input} value=${other} onChange=${onOther} placeholder=${t("ageOther")} disabled=${disabled} class="mt"/>` : null}
  </div>`;
}

/* ---------- Aimag / soum picker ---------- */
function AdminPicker({ aimag, soum, onAimag, onSoum, disabled }) {
  const [fa, setFa] = useState(false); const [fs, setFs] = useState(false);
  const na = norm(aimag), ns = norm(soum);
  const aimagHit = AIMAGS.find(a => norm(a) === na);
  const aimagList = fa ? AIMAGS.filter(a => !na || norm(a).includes(na)) : [];
  const soumPool = aimagHit ? ADMIN[aimagHit].map(s => [s, aimagHit]) : AIMAGS.flatMap(a => ADMIN[a].map(s => [s, a]));
  const soumList = fs ? [...soumPool.filter(([s]) => !ns || norm(s).startsWith(ns)).sort((a, b) => (norm(a[0]) === ns ? 0 : 1) - (norm(b[0]) === ns ? 0 : 1) || a[0].length - b[0].length), ...(ns ? soumPool.filter(([s]) => !norm(s).startsWith(ns) && norm(s).includes(ns)) : [])].slice(0, 60) : [];
  const drop = (items, onPick) => items.length ? html`<div class="sp-list">${items.map(([s, a]) => html`<button type="button" key=${s + a} class="sp-item" onMouseDown=${e => e.preventDefault()} onClick=${() => onPick(s, a)}><span class="sp-main">${s}</span>${a ? html`<span class="sp-sub">${a}</span>` : null}</button>`)}</div>` : null;
  return html`<div class="grid2">
    <${Field} label=${t("aimag")}><div class="sp-wrap">
      <input class="inp" value=${aimag || ""} disabled=${disabled} autocomplete="off" onInput=${e => { onAimag(e.target.value); setFa(true); }} onFocus=${() => setFa(true)} onBlur=${() => setTimeout(() => setFa(false), 150)}/>
      ${drop(aimagList.map(a => [a, ""]), a => { onAimag(a); setFa(false); })}
    </div><//>
    <${Field} label=${t("soum")}><div class="sp-wrap">
      <input class="inp" value=${soum || ""} disabled=${disabled} autocomplete="off" onInput=${e => { onSoum(e.target.value); setFs(true); }} onFocus=${() => setFs(true)} onBlur=${() => setTimeout(() => setFs(false), 150)}/>
      ${drop(soumList, (s, a) => { onSoum(s); if (a && norm(aimag) !== norm(a)) onAimag(a); setFs(false); })}
    </div><//>
  </div>`;
}

/* ---------- Compass ---------- */
async function compassPermission() {
  try { if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") { const r = await DeviceOrientationEvent.requestPermission(); return r === "granted"; } } catch (e) { return false; }
  return true;
}
function CompassModal({ onPick, onClose }) {
  const [hd, setHd] = useState(null); const [err, setErr] = useState("");
  useEffect(() => {
    const h = e => { let v = null; if (e.webkitCompassHeading != null) v = e.webkitCompassHeading; else if (e.alpha != null) v = (360 - e.alpha) % 360; if (v != null && !isNaN(v)) setHd(Math.round(v) % 360); };
    window.addEventListener("deviceorientationabsolute", h, true); window.addEventListener("deviceorientation", h, true);
    const to = setTimeout(() => { setHd(x => { if (x === null) setErr(t("compassErr")); return x; }); }, 4000);
    return () => { window.removeEventListener("deviceorientationabsolute", h, true); window.removeEventListener("deviceorientation", h, true); clearTimeout(to); };
  }, []);
  const rot = hd === null ? 0 : -hd;
  return html`<${Modal} title=${t("compass")} onClose=${onClose}>
    <div class="compass">
      <div class="cdial" style=${`transform:rotate(${rot}deg)`}>
        ${["N", "E", "S", "W"].map((l, i) => html`<span key=${l} class=${`cl ${l === "N" ? "n" : ""}`} style=${`transform:rotate(${i * 90}deg) translateY(-88px) rotate(${-i * 90}deg)`}>${l}</span>`)}
        ${[...Array(36)].map((_, i) => html`<i key=${i} class=${`tick ${i % 9 === 0 ? "big" : ""}`} style=${`transform:rotate(${i * 10}deg) translateY(-104px)`}/>`)}
      </div>
      <div class="cneedle"/>
      <div class="cval">${hd === null ? "…" : hd + "°"}</div>
    </div>
    <div class="hint" style="text-align:center">${err || t("compassHint")}</div>
    <div class="row end mt"><${Btn} kind="ghost" onClick=${onClose}>${t("cancel")}<//><${Btn} onClick=${() => { if (hd !== null) onPick(hd); }} disabled=${hd === null}>${t("compassTake")}<//></div>
  <//>`;
}
function CompassBtn({ onPick, disabled }) {
  const [open, setOpen] = useState(false);
  return html`<button type="button" class="btn ghost small cbtn" disabled=${disabled} onClick=${async () => { if (await compassPermission()) setOpen(true); else showToast(t("compassPerm")); }} title=${t("compass")}>🧭</button>
    ${open ? html`<${CompassModal} onClose=${() => setOpen(false)} onPick=${v => { setOpen(false); onPick(String(v)); }}/>` : null}`;
}
</script>
<script>/* ===== BRCC Mongolia — views ===== */

/* ---------- Home ---------- */
function Home() {
  const s = useStore(); const [creating, setCreating] = useState(false);
  const studies = [...s.meta.studies].sort((a, b) => b.createdAt - a.createdAt);
  return html`<div class="page">
    <${TopBar} back=${false} title=${t("appTitle")} sub=${t("appSub")} right=${html`<button class="iconbtn" onClick=${() => nav("#/settings")} aria-label=${t("settings")}>⚙</button>`}/>

      <div class="sec-h"><h2>${t("studies")}</h2><${Btn} onClick=${() => setCreating(true)}>+ ${t("newStudy")}<//></div>

        const ss = Object.values(s.sessions).filter(x => x.studyId === st.id); const nvp = ss.filter(x => x.type === "VP").length, nlt = ss.length - nvp;
        return html`<button key=${st.id} class="card link" onClick=${() => nav("#/study/" + st.id)}>

      }) : html`<${Empty}>${t("emptyStudies")}<//>`}
    </section>
    ${s.queue.length && s.meta.settings.sheetsUrl ? html`<div class="notice">${t("pending")}: ${s.queue.length} <${Btn} small kind="ghost" onClick=${flushQueue}>${t("syncNow")}<//></div>` : null}
    <footer class="foot"><div class="foot-links"><a href="#/trash">${t("trash")}${s.trash.length ? ` (${s.trash.length})` : ""}</a> · <a href="#/about">${t("about")}</a></div><p class="own">${t("ownership")}</p></footer>
    ${creating ? html`<${StudyModal} onClose=${() => setCreating(false)}/>` : null}
  </div>`;
}
function StudyModal({ study, onClose }) {
  const [f, setF] = useState(study ? { ...study } : { name: "", speciesLang: "mn", windFarm: false });
  const ok = () => {
    if (!f.name.trim()) return;

    onClose();
  };
  const langs = [["mn", "Монгол"], ["en", "English"], ["la", "Latin"]];
  return html`<${Modal} title=${study ? t("edit") : t("newStudy")} onClose=${onClose}>
    <${Field} label=${t("studyName")}><${Input} value=${f.name} onChange=${v => setF({ ...f, name: v })} placeholder="Uvs airport" autofocus/><//>
    <${Field} label=${t("speciesLang")}><${Chips} options=${langs.map(l => l[1])} value=${(langs.find(l => l[0] === f.speciesLang) || langs[0])[1]} onChange=${v => { const l = langs.find(x => x[1] === v); if (l) setF({ ...f, speciesLang: l[0] }); }}/><//>
    <label class="check"><input type="checkbox" checked=${!!f.windFarm} onChange=${e => setF({ ...f, windFarm: e.target.checked })}/> ${t("windFarm")}<div class="hint">${t("windFarmHint")}</div></label>

function useTick(ms) { const [, f] = useState(0); useEffect(() => { const i = setInterval(() => f(x => x + 1), ms); return () => clearInterval(i); }, [ms]); }
function SessionView({ id, recId }) {
  const s = useStore(); const sess = s.sessions[id]; useTick(1000);
  const [busy, setBusy] = useState(false);
  useEffect(() => { if (sess && sess.type === "LT" && sess.tracking && sess.status === "open" && Tracker.sessionId !== id) Tracker.start(id); }, [id]);
  const st = sess ? (getStudy(sess.studyId) || {}) : {}; const lang = st.speciesLang || "mn"; const locked = !!sess && sess.status === "closed"; const isVP = !!sess && sess.type === "VP";
  const plannedMs = sess ? (+sess.plannedH || 0) * 3600000 : 0; const elapsed = sess && sess.startedAt ? Date.now() - sess.startedAt : 0; const remaining = plannedMs - elapsed;
  const timeOver = !!sess && isVP && !!sess.startedAt && plannedMs > 0 && remaining <= 0;
  useEffect(() => { if (timeOver && !sess.alarmed && !locked) { beep(4); updSession(id, n => { n.alarmed = true; n.end = n.end || nowHM(); }); } }, [timeOver, sess && sess.alarmed]);
  if (!sess) return html`<div class="page"><${TopBar} title="?"/><${Empty}>${t("empty")}<//></div>`;
  const set = k => v => updSession(id, n => { n[k] = v; if (n.type === "VP" && (k === "start" || k === "plannedH")) n.end = addHours(n.start, n.plannedH) || n.end; });
  if (recId) { const r = sess.records.find(x => x.id === recId); if (r) return html`<${RecordForm} key=${r.id} sess=${sess} rec=${r} lang=${lang} windFarm=${!!st.windFarm} locked=${locked}/>`; }
  const fmtDur = ms => { ms = Math.max(0, ms); const h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000), sec = Math.floor(ms % 60000 / 1000); return `${h}:${pad2(m)}:${pad2(sec)}`; };

  const startSession = async () => {
    primeAudio();
    if (isVP) { updSession(id, n => { n.started = true; n.startedAt = Date.now(); n.start = n.start || nowHM(); n.end = addHours(n.start, n.plannedH) || n.end; n.alarmed = false; }); showToast(t("alarmHint")); }
    else { Tracker.start(id, { gate: true }); }
  };
  const finish = async () => {
    const drafts = sess.records.filter(r => r.status === "draft").length;
    if (drafts && !confirmDlg(`${drafts} ${t("incompleteWarn")}\n\n${t("confirmFinish")}`)) return;
    if (!drafts && !confirmDlg(t("confirmFinish"))) return;
    if (!isVP) { Tracker.stop(); let end = null; try { end = await getPosition({ timeout: 8000 }); } catch (e) { } updSession(id, n => { n.tracking = false; const lp = n.track[n.track.length - 1]; if (end) { n.endLat = end.lat; n.endLng = end.lng; } else if (lp && !n.endLat) { n.endLat = lp.lat; n.endLng = lp.lng; } if (!n.length && n.track.length > 1) n.length = trackLength(n.track); }); }
    updSession(id, n => { n.status = "closed"; n.end = n.end || nowHM(); });
    enqueueRow("session", { ...sessionHeader(Store.s.sessions[id]), id, observations: Store.s.sessions[id].records.length, status: "closed" });
  };
  const reopen = () => { if (confirmDlg(t("confirmReopen"))) updSession(id, n => { n.status = "open"; }); };
  const addRecord = (extra) => { const r = newRecord(sess, extra); updSession(id, n => { n.records = [...n.records, r]; }); nav(`#/session/${id}/rec/${r.id}`); };
  const quick = async () => {

    if (isVP) extra.timerStart = Date.now();
    const r = newRecord(sess, extra); updSession(id, n => { n.records = [...n.records, r]; }); showToast(`${t("quickCapture")} · ${t("detailsLater")}`);
    if (!isVP) { const lp = Tracker.last && !Tracker.last.skipped ? Tracker.last : null; if (lp) updRecord(id, r.id, x => { x.lat = lp.lat; x.lng = lp.lng; x.acc = lp.acc; }); else try { const p = await getPosition(); updRecord(id, r.id, x => { x.lat = p.lat; x.lng = p.lng; x.acc = p.acc; }); } catch (e) { } }
  };
  const del = () => { if (confirmDlg(t("confirmDelete"))) { Tracker.stop(); deleteSession(id); showToast(t("deleted")); nav("#/study/" + sess.studyId); } };

      ${!isVP ? html`<${Btn} kind="secondary" onClick=${exportKmz} disabled=${busy}>${t("exportKmz")}<//>` : null}
      ${!locked ? html`<${Btn} kind="danger" small onClick=${del}>${t("delete")}<//>` : null}
    </div></section>
  </div>`;
}
function RecordCard({ r, idx, lang, isVP, onOpen, onStop }) {
  const running = r.timerStart && !r.duration && r.status === "draft";
  const secs = running ? Math.round((Date.now() - r.timerStart) / 1000) : null;
  const w = r.weather || {};
  return html`<div class=${`card rec ${r.status === "draft" ? "draft" : ""}`}>
    <button class="rec-main" onClick=${onOpen}>
      <div class="rec-n">${idx}</div>
      <div class="rec-b">
        <div class="card-t">${r.species ? speciesName(r.species, lang) : html`<span class="warn">${t("species")}?</span>`}${r.count ? html` <span class="muted">× ${r.count}</span>` : null}</div>
        <div class="card-s">${r.time}${isVP ? html`${r.duration ? ` · ${r.duration} s` : ""}${r.dirFrom || r.dirTo ? ` · ${r.dirFrom || "?"}°→${r.dirTo || "?"}°` : ""}${r.hMin || r.hMax ? ` · ${r.hMin || "?"}–${r.hMax || "?"} m` : ""}` : html`${r.dist ? ` · ${r.dist} m` : ""}${r.azimuth ? ` · ${r.azimuth}°` : ""}${r.lat ? ` · ${r.lat}, ${r.lng}` : ""}`}${ageSexText(r) ? ` · ${ageSexText(r)}` : ""}</div>
        ${r.activities && r.activities.length ? html`<div class="card-s">${r.activities.map(a => a.split(" (")[0]).join(", ")}</div>` : null}
        ${r.status === "draft" ? html`<div class="card-s warn">${t("drafts")}</div>` : null}
      </div>

    ${running ? html`<button class="btn danger small stopbtn" onClick=${onStop}>■ ${secs}s</button>` : null}
  </div>`;
}

/* ---------- Record form ---------- */
function RecordForm({ sess, rec, lang, windFarm, locked }) {
  useTick(1000);
  const isVP = sess.type === "VP"; const r = rec; const dis = locked;
  const upd = fn => updRecord(sess.id, r.id, fn); const set = k => v => upd(x => { x[k] = v; });
  const g = r.species ? r.species.g : null; const showHeight = isVP && (!g || g === "B");
  const running = r.timerStart && !r.duration;
  const [gpsMsg, setGpsMsg] = useState("");
  const getGps = async () => { setGpsMsg(t("gpsSearching")); try { const p = await getPosition(); upd(x => { x.lat = p.lat; x.lng = p.lng; x.acc = p.acc; }); setGpsMsg(`±${p.acc} m`); } catch (e) { setGpsMsg(t("gpsFail")); } };
  useEffect(() => { if (!isVP && !r.lat && !locked) { const lp = Tracker.last && !Tracker.last.skipped ? Tracker.last : null; if (lp) upd(x => { x.lat = lp.lat; x.lng = lp.lng; x.acc = lp.acc; }); else getGps(); } }, []);
  // computed animal position
  useEffect(() => { if (!isVP && r.lat && r.lng && r.dist !== "" && r.azimuth !== "" && !isNaN(+r.dist) && !isNaN(+r.azimuth)) { const p = destPoint(+r.lat, +r.lng, +r.azimuth, +r.dist); if (p.lat !== r.aLat || p.lng !== r.aLng) upd(x => { x.aLat = p.lat; x.aLng = p.lng; }); } }, [r.lat, r.lng, r.dist, r.azimuth]);
  const valid = !!r.species;
  const rangeBad = ["dirFrom", "dirTo", "azimuth"].some(k => outOfRange(r[k], 0, 360));
  const sexVals = Object.values(r.sexC || {}).filter(x => x !== "" && !isNaN(+x)).map(Number); const sexSum = sexVals.reduce((a, b) => a + b, 0);
  const sexWarn = sexVals.length > 0 && r.count !== "" && !isNaN(+r.count) && sexSum !== +r.count;
  const save = (next) => {
    if (!valid) { showToast(t("species") + "?"); return; }
    if (rangeBad) { showToast(t("rangeErr")); return; }
    if (sexVals.length && r.count === "") upd(x => { x.count = String(sexSum); });
    else if (sexWarn) { showToast(t("sexMismatch")); return; }
    upd(x => { x.status = "saved"; if (x.timerStart && !x.duration) { x.duration = String(Math.round((Date.now() - x.timerStart) / 1000)); } x.timerStart = null; });
    const s2 = Store.s.sessions[sess.id]; const r2 = s2.records.find(x => x.id === r.id); enqueueRow("record", recordRow(s2, r2, s2.records.indexOf(r2)));
    showToast(t("saved"));
    if (next) { const nr = newRecord(Store.s.sessions[sess.id], { species: r.species }); updSession(sess.id, n => { n.records = [...n.records, nr]; }); location.replace(`#/session/${sess.id}/rec/${nr.id}`); }
    else goBack();
  };
  const del = () => { if (confirmDlg(t("confirmDelete"))) { deleteRecord(sess.id, r.id); showToast(t("deleted")); goBack(); } };
  const idx = sess.records.indexOf(r) + 1;
  return html`<div class="page">
    <${TopBar} title=${`${t("records")} № ${idx}`} sub=${`${sess.type} ${sess.number || ""} · ${sess.date}`} right=${r.status === "draft" ? html`<span class="tag warn">${t("drafts")}</span>` : null}/>
    <form class="form" onSubmit=${e => e.preventDefault()}>
      <${Field} label=${t("species")}><${SpeciesPicker} value=${r.species} onChange=${v => upd(x => { x.species = v; if (v && AGE[v.g]) { const ok = AGE[v.g].map(o => o[0]); for (const k of Object.keys(x.ageC || {})) if (!ok.includes(k)) delete x.ageC[k]; } })} lang=${lang} disabled=${dis} autoFocus=${!r.species}/><//>
      <div class="grid2">
        <${Field} label=${t("timeObserved")}><${TimeInput} value=${r.time} onChange=${set("time")} disabled=${dis}/><//>
        ${isVP ? html`<${Field} label=${t("duration")} span>
          <div class="row"><${NumInput} value=${r.duration} onChange=${set("duration")} min="0" disabled=${dis || running}/>
          ${!dis ? (running ? html`<${Btn} kind="danger" small onClick=${() => upd(x => { x.duration = String(Math.round((Date.now() - x.timerStart) / 1000)); x.timerStart = null; })}>■ ${Math.round((Date.now() - r.timerStart) / 1000)}s<//>` : html`<${Btn} kind="ghost" small onClick=${() => upd(x => { x.timerStart = Date.now(); x.duration = ""; })}>▶ ${t("timerStart")}<//>`) : null}</div>
        <//>` : null}
      </div>
      <${Field} label=${t("count")}><${CountPicker} value=${r.count} onChange=${set("count")} disabled=${dis}/><//>
      <${Field} label=${t("age")}><${AgePicker} group=${g} value=${r.ageC} other=${r.ageOther} onChange=${set("ageC")} onOther=${set("ageOther")} disabled=${dis}/><//>
      <${Field} label=${t("sex")} hint=${sexWarn ? html`<span class="warn">${t("sexMismatch")}</span>` : null}><${CountedChips} options=${SEX} value=${r.sexC} onChange=${set("sexC")} disabled=${dis}/><//>
      ${isVP && windFarm ? html`<div class="grid2">
        <${Field} label=${t("turbine")}><${NumInput} value=${r.turbine} onChange=${set("turbine")} min="0" disabled=${dis}/><//>
        <${Field} label=${t("turbineDist")}><${NumInput} value=${r.turbineDist} onChange=${set("turbineDist")} min="0" disabled=${dis}/><//>
      </div>` : null}
      ${isVP ? html`<${Field} label=${t("direction")} hint=${rangeBad ? html`<span class="warn red">${t("rangeErr")}</span>` : null}><div class="row"><${NumInput} range value=${r.dirFrom} onChange=${set("dirFrom")} min="0" max="360" placeholder=${t("from")} disabled=${dis}/>${!dis ? html`<${CompassBtn} onPick=${set("dirFrom")}/>` : null}<span class="arrow">→</span><${NumInput} range value=${r.dirTo} onChange=${set("dirTo")} min="0" max="360" placeholder=${t("to")} disabled=${dis}/>${!dis ? html`<${CompassBtn} onPick=${set("dirTo")}/>` : null}</div><//>` : null}
      ${showHeight ? html`
        <${Field} label=${t("height")}><div class="row"><${NumInput} value=${r.hMin} onChange=${set("hMin")} min="0" placeholder=${t("min")} disabled=${dis}/><span class="arrow">–</span><${NumInput} value=${r.hMax} onChange=${set("hMax")} min="0" placeholder=${t("max")} disabled=${dis}/></div><//>` : null}
      ${isVP ? html`<${Field} label=${t("distance")}><div class="row"><${NumInput} value=${r.distFirst} onChange=${set("distFirst")} min="0" placeholder=${t("distFirst")} disabled=${dis}/><span class="arrow">→</span><${NumInput} value=${r.distLast} onChange=${set("distLast")} min="0" placeholder=${t("distLast")} disabled=${dis}/></div><//>` : html`
        <div class="grid2">
          <${Field} label=${t("distBird")}><${NumInput} value=${r.dist} onChange=${set("dist")} min="0" disabled=${dis}/><//>
          <${Field} label=${t("azimuth")} hint=${rangeBad ? html`<span class="warn red">${t("rangeErr")}</span>` : null}><div class="row"><${NumInput} range value=${r.azimuth} onChange=${set("azimuth")} min="0" max="360" disabled=${dis}/>${!dis ? html`<${CompassBtn} onPick=${set("azimuth")}/>` : null}</div><//>
        </div>
        <${Field} label=${`${t("observerPos")} N / E`} hint=${gpsMsg}><div class="row"><${NumInput} decimal value=${r.lat} onChange=${set("lat")} disabled=${dis}/><${NumInput} decimal value=${r.lng} onChange=${set("lng")} disabled=${dis}/>${!dis ? html`<${Btn} kind="ghost" small onClick=${getGps}>GPS<//>` : null}</div><//>
        ${r.aLat ? html`<div class="hint mb">${t("birdPos")}: ${r.aLat}, ${r.aLng}</div>` : null}`}
      <${Field} label=${isVP ? t("activity") : t("behaviour")}>
        ${g === "B" || g === "M" ? html`<${ActivityPicker} group=${g} value=${r.activities} onChange=${set("activities")} disabled=${dis}/>` : html`<${Input} value=${(r.activities || []).join("; ")} onChange=${v => set("activities")(v ? [v] : [])} placeholder=${t("freeText")} disabled=${dis}/>`}
      <//>
      <${Field} label=${t("weather")}><${WeatherFields} value=${r.weather} onChange=${set("weather")} disabled=${dis}/><//>
      <${Field} label=${t("habitat")}><${Input} value=${r.habitat} onChange=${set("habitat")} disabled=${dis}/><//>
      <${Field} label=${t("noteField")}><${TextArea} value=${r.notes} onChange=${set("notes")} disabled=${dis}/><//>
      ${!dis ? html`<div class="sticky-actions">
        <${Btn} kind="danger" small onClick=${del}>${t("delete")}<//>
        <div class="row"><${Btn} kind="secondary" onClick=${() => save("new")} disabled=${!valid}>${t("saveNext")}<//><${Btn} onClick=${() => save()} disabled=${!valid}>${t("save")}<//></div>
      </div>` : html`<div class="sticky-actions"><span/><${Btn} kind="ghost" onClick=${goBack}>${t("close")}<//></div>`}
    </form>
  </div>`;
}

/* ---------- Note ---------- */
function NoteView({ id }) {
  const s = useStore(); const n = s.notes[id]; const [photos, setPhotos] = useState({}); const fileRef = useRef();
  useEffect(() => { (async () => { if (!n) return; const out = {}; for (const pid of n.photos || []) out[pid] = await DB.get("photo:" + pid); setPhotos(out); })(); }, [id, n && (n.photos || []).length]);
  const dirty = useRef(false);
  useEffect(() => () => { const cur = Store.s.notes[id]; if (dirty.current && cur && (cur.text || (cur.photos || []).length)) enqueueNote(cur); }, [id]);
  if (!n) return html`<div class="page"><${TopBar} title="?"/></div>`;
  const st = getStudy(n.studyId) || {};
  const upd = fn => { const x = { ...n }; fn(x); x.updatedAt = Date.now(); saveNote(x); dirty.current = true; };
  const addPhoto = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return; e.target.value = "";
    const url = await new Promise(res => { const img = new Image(); img.onload = () => { const max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", 0.75)); }; img.src = URL.createObjectURL(f); });
    const pid = uid(); await DB.set("photo:" + pid, url); upd(x => { x.photos = [...(x.photos || []), pid]; });
  };
  const rmPhoto = async pid => { if (!confirmDlg(t("confirmDelete"))) return; upd(x => { x.photos = x.photos.filter(p => p !== pid); }); await DB.del("photo:" + pid); };
  const next = () => { const num = (Store.s.meta.noteSeq[n.studyId] || 0) + 1; Store.s.meta.noteSeq[n.studyId] = num; saveMeta(); const nn = { id: uid(), studyId: n.studyId, n: num, date: todayISO(), text: "", photos: [], createdAt: Date.now(), updatedAt: Date.now() }; saveNote(nn); location.replace("#/note/" + nn.id); };
  const del = () => { if (confirmDlg(t("confirmDelete"))) { deleteNote(id); showToast(t("deleted")); nav("#/study/" + n.studyId); } };
  return html`<div class="page">
    <${TopBar} title=${`${t("notes")} ${n.n}`} sub=${st.name}/>
    <div class="form">
      <${Field} label=${t("date")}><input type="date" class="inp" value=${n.date} onInput=${e => upd(x => { x.date = e.target.value; })}/><//>
      <textarea class="inp ta note" rows="10" placeholder=${t("noteHint")} value=${n.text} onInput=${e => upd(x => { x.text = e.target.value; })}></textarea>
      <div class="photos">${(n.photos || []).map(pid => html`<div key=${pid} class="ph">${photos[pid] ? html`<img src=${photos[pid]} alt=""/>` : null}<button class="iconbtn del" onClick=${() => rmPhoto(pid)}>×</button></div>`)}</div>
      <input type="file" accept="image/*" ref=${fileRef} style="display:none" onChange=${addPhoto}/>
      <div class="row wrap"><${Btn} kind="ghost" onClick=${() => fileRef.current.click()}>📷 ${t("addPhoto")}<//><${Btn} kind="danger" small onClick=${del}>${t("delete")}<//></div>
      <div class="sticky-actions"><span/><div class="row"><${Btn} kind="secondary" onClick=${next}>${t("nextNote")} →<//><${Btn} onClick=${goBack}>${t("save")}<//></div></div>
    </div>
  </div>`;
}

/* ---------- Settings ---------- */
function SettingsView() {
  const s = useStore(); const st = s.meta.settings; const fileRef = useRef(); const [busy, setBusy] = useState(false);
  const set = k => v => { Store.s.meta.settings = { ...Store.s.meta.settings, [k]: v }; if (k === "lang") LANG = v; if (k === "night") document.body.classList.toggle("night", !!v); saveMeta(); };
  const exportAll = async () => { setBusy(true); try { await saveFile(`BRCC_all_${todayISO()}.xlsx`, buildWorkbook(Object.values(s.sessions), Object.values(s.notes)), "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"); } finally { setBusy(false); } };
  const restore = async e => { const f = e.target.files && e.target.files[0]; if (!f) return; e.target.value = ""; if (!confirmDlg(t("restoreConfirm"))) return; try { await importBackup(await f.text()); showToast(t("restored")); } catch (err) { alert("Error: " + err.message); } };
  return html`<div class="page">
    <${TopBar} title=${t("settings")}/>
    <div class="form">
      <${Field} label=${t("language")}><${Chips} options=${["Монгол", "English"]} value=${st.lang === "en" ? "English" : "Монгол"} onChange=${v => set("lang")(v === "English" ? "en" : "mn")}/><//>
      <label class="check"><input type="checkbox" checked=${!!st.night} onChange=${e => set("night")(e.target.checked)}/> ${t("night")}</label>
      <${Field} label=${t("observer")}><${Input} value=${st.observer} onChange=${set("observer")}/><//>
      <${Field} label=${t("sheetsUrl")} hint=${t("sheetsHint")}><${Input} value=${st.sheetsUrl} onChange=${set("sheetsUrl")} placeholder="https://script.google.com/macros/s/…/exec"/><//>
      ${st.sheetsUrl ? html`<div class="row"><span class="muted">${t("pending")}: ${s.queue.length}</span><${Btn} small kind="ghost" onClick=${flushQueue}>${t("syncNow")}<//></div>` : null}
      <hr/>
      <div class="row wrap">
        <${Btn} kind="secondary" onClick=${exportAll} disabled=${busy}>${t("exportAll")}<//>
        <${Btn} kind="secondary" onClick=${() => shareCsv(`BRCC_all_${todayISO()}.csv`, Object.values(s.sessions))} disabled=${busy}>${t("csvShare")}<//>
        <${Btn} kind="secondary" onClick=${exportBackup}>${t("backup")}<//>
        <${Btn} kind="ghost" onClick=${() => fileRef.current.click()}>${t("restore")}<//>
        <input type="file" accept="application/json,.json" ref=${fileRef} style="display:none" onChange=${restore}/>
      </div>
      <p class="hint">${t("storageWarn")}</p>
      <p class="hint">${t("installHint")}</p>
      <div class="row wrap"><a class="btn ghost" href="#/trash">${t("trash")} (${s.trash.length})</a><a class="btn ghost" href="#/about">${t("about")}</a></div>
    </div>
  </div>`;
}

/* ---------- Trash ---------- */
function TrashView() {
  const s = useStore();
  const forever = tid => { if (!confirmDlg(t("deleteForever") + "?")) return; Store.s.trash = Store.s.trash.filter(x => x.trashId !== tid); saveTrash(); };
  return html`<div class="page">
    <${TopBar} title=${t("trash")}/>
    <p class="hint pad">${t("trashHint")}</p>
    ${s.trash.length ? s.trash.map(it => html`<div key=${it.trashId} class="card row between">
      <div><div class="card-t">${it.label}</div><div class="card-s">${it.kind} · ${fmtDT(it.deletedAt)}</div></div>
      <div class="row"><${Btn} small kind="secondary" onClick=${() => { restoreTrash(it.trashId); showToast(t("restored")); }}>${t("restoreItem")}<//><${Btn} small kind="danger" onClick=${() => forever(it.trashId)}>✕<//></div>
    </div>`) : html`<${Empty}>${t("trashEmpty")}<//>`}

function AboutView() {

    <div class="form about">

/* ---------- Root / router ---------- */
function useRoute() {
  const parse = () => { const h = location.hash.replace(/^#\/?/, ""); const p = h.split("/"); return { view: p[0] || "home", id: p[1], sub: p[2], subId: p[3] }; };
  const [r, setR] = useState(parse);
  useEffect(() => { const f = () => { setR(parse()); window.scrollTo(0, 0); }; window.addEventListener("hashchange", f); return () => window.removeEventListener("hashchange", f); }, []);
  return r;
}
function App() {
  const s = useStore(); const r = useRoute(); const [online, setOnline] = useState(navigator.onLine);
  useEffect(() => { const f = () => setOnline(navigator.onLine); window.addEventListener("online", f); window.addEventListener("offline", f); return () => { window.removeEventListener("online", f); window.removeEventListener("offline", f); }; }, []);
  useEffect(() => { document.body.classList.toggle("night", !!s.meta.settings.night); }, [s.meta.settings.night]);
  let view;
  switch (r.view) {
    case "study": view = html`<${StudyView} id=${r.id} sub=${r.sub}/>`; break;
    case "session": view = html`<${SessionView} id=${r.id} recId=${r.sub === "rec" ? r.subId : null}/>`; break;
    case "note": view = html`<${NoteView} id=${r.id}/>`; break;
    case "settings": view = html`<${SettingsView}/>`; break;
    case "trash": view = html`<${TrashView}/>`; break;
    case "about": view = html`<${AboutView}/>`; break;
    default: view = html`<${Home}/>`;
  }
  return html`<div class="app">
    ${!online ? html`<div class="offline">${t("offline")}</div>` : null}
    ${view}
    ${Store.toast ? html`<div class="toast" key=${Store.toast.id}>${Store.toast.msg}${Store.toast.action ? html`<button onClick=${Store.toast.action.fn}>${Store.toast.action.label}</button>` : null}</div>` : null}
  </div>`;
}
(async () => {
  await loadAll();
  render(html`<${App}/>`, document.getElementById("root"));
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });
})();
</script>
